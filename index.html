
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World | Right Way Welfare</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #243047;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            background: white;
            padding: 50px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            color: #18794e;
            margin-bottom: 16px;
            font-size: 2.5rem;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 24px;
        }

        a {
            display: inline-block;
            background: #18794e;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
        }

        a:hover {
            background: #125c3b;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Hello, World! 👋</h1>
        <p>
            Welcome to Right Way Women and Children
            Welfare Organization.
        </p>
        <a href="https://github.com/" target="_blank"
           rel="noopener noreferrer">
            Visit GitHub
        </a>
    </main>
</body>
</html>
